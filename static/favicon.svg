<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" /> <!-- violet-900 -->
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#1e1b4b" /> <!-- indigo-950 -->
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" /> <!-- violet-400 -->
      <stop offset="100%" stop-color="#db2777" /> <!-- pink-600 -->
    </linearGradient>

    <linearGradient id="wave-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" /> <!-- indigo-400 -->
      <stop offset="50%" stop-color="#c084fc" /> <!-- purple-400 -->
      <stop offset="100%" stop-color="#f472b6" /> <!-- pink-400 -->
    </linearGradient>

    <linearGradient id="helm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ddd6fe" /> <!-- violet-200 -->
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid/Tech lines in background -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1.5" />
  <line x1="256" y1="56" x2="256" y2="456" stroke="rgba(255,255,255,0.02)" stroke-width="1.5" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="rgba(255,255,255,0.02)" stroke-width="1.5" />

  <!-- Helm (Leme) Icon - representing Docker control -->
  <g filter="url(#shadow)" transform="translate(0, -20)">
    <!-- Outer Rim -->
    <circle cx="256" cy="220" r="80" fill="none" stroke="url(#helm-grad)" stroke-width="14" />
    <!-- Center Hub -->
    <circle cx="256" cy="220" r="24" fill="url(#helm-grad)" />
    <circle cx="256" cy="220" r="10" fill="#4c1d95" />
    
    <!-- Spokes (Raios do Leme) -->
    <!-- Vertical -->
    <line x1="256" y1="110" x2="256" y2="330" stroke="url(#helm-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- Horizontal -->
    <line x1="146" y1="220" x2="366" y2="220" stroke="url(#helm-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- Diagonal 1 -->
    <line x1="178" y1="142" x2="334" y2="298" stroke="url(#helm-grad)" stroke-width="12" stroke-linecap="round" />
    <!-- Diagonal 2 -->
    <line x1="178" y1="298" x2="334" y2="142" stroke="url(#helm-grad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Handles (Cabos externos) -->
    <circle cx="256" cy="100" r="12" fill="url(#helm-grad)" />
    <circle cx="256" cy="340" r="12" fill="url(#helm-grad)" />
    <circle cx="136" cy="220" r="12" fill="url(#helm-grad)" />
    <circle cx="376" cy="220" r="12" fill="url(#helm-grad)" />
    <circle cx="168" cy="132" r="12" fill="url(#helm-grad)" />
    <circle cx="344" cy="308" r="12" fill="url(#helm-grad)" />
    <circle cx="168" cy="308" r="12" fill="url(#helm-grad)" />
    <circle cx="344" cy="132" r="12" fill="url(#helm-grad)" />
  </g>

  <!-- Deep Ocean Waves at the bottom -->
  <g filter="url(#shadow)">
    <!-- Back Wave -->
    <path d="M 0 380 Q 120 320 240 370 T 480 340 L 512 340 L 512 512 L 0 512 Z" fill="url(#wave-back)" opacity="0.65" />
    
    <!-- Front Wave (Dynamic sea) -->
    <path d="M 0 410 Q 140 360 270 420 T 512 390 L 512 512 L 0 512 Z" fill="url(#wave-front)" />
  </g>

  <!-- Small boat silhouette or container suggestion -->
  <g fill="#ffffff" filter="url(#glow)" opacity="0.9" transform="translate(240, 345) scale(0.7)">
    <path d="M 10 30 L 40 30 L 45 15 L 5 15 Z" />
    <polygon points="25,5 25,15 38,15" />
  </g>
</svg>
