# ==============================================================================
# FASE 1: PILOTO DO DOMÍNIO NETWORKS & INFRAESTRUTURA BASE
# Objetivo: Estabelecer as fundações, convenções e refatorar 100% do módulo de Redes.
# ==============================================================================

[phase_1]
name = "Piloto do Módulo de Redes (Networks)"
description = "Implementação da camada de domínio, casos de uso, infraestrutura Wails e quebra dos componentes da página de Redes."

  # ----------------------------------------------------------------------------
  # Etapa 1.1: Organização dos Componentes Globais Compartilhados
  # ----------------------------------------------------------------------------
  [[phase_1.steps]]
  step = "1.1"
  title = "Reestruturação de Componentes Base (UI / Common / Modals)"
  tasks = [
    "Mover/Organizar componentes visuais genéricos para 'frontend/src/lib/components/ui/' (Modal, StatusBanner, Input, CodeEditor, botões)",
    "Mover/Organizar componentes de layout/estado para 'frontend/src/lib/components/common/' (DockerseaLoading, VpsSelectWarning, ActiveServerWidget, SidebarItem, PortsPanel)",
    "Mover/Organizar modais complexos globais para 'frontend/src/lib/components/modals/' (ConfigModal, TerminalModal, PullProgressModal)",
    "Atualizar imports dos componentes compartilhados já existentes"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 1.2: Camada de Domínio e Infraestrutura de Redes
  # ----------------------------------------------------------------------------
  [[phase_1.steps]]
  step = "1.2"
  title = "Criação do Domínio Networks ($lib/domains/networks)"
  tasks = [
    "Criar 'frontend/src/lib/domains/networks/domain/network.types.ts' definindo interfaces limpas (Network, IPAMConfig, ContainerAttachment)",
    "Criar 'frontend/src/lib/domains/networks/domain/network.rules.ts' com regras de negócio puras (ex: validação de CIDR/IP, restrições de remoção de redes padrão)",
    "Criar 'frontend/src/lib/domains/networks/infrastructure/network.wails.ts' encapsulando os bindings Go/Wails do NetworkService",
    "Criar 'frontend/src/lib/domains/networks/application/list-networks.ts'",
    "Criar 'frontend/src/lib/domains/networks/application/create-network.ts'",
    "Criar 'frontend/src/lib/domains/networks/application/remove-network.ts'",
    "Criar 'frontend/src/lib/domains/networks/application/connect-container.ts'",
    "Criar 'frontend/src/lib/domains/networks/application/prune-networks.ts'",
    "Criar 'frontend/src/lib/domains/networks/index.ts' como ponto de exportação pública (Public API) do domínio"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 1.3: Hook Reativo de Gerenciamento de Estado
  # ----------------------------------------------------------------------------
  [[phase_1.steps]]
  step = "1.3"
  title = "Criação do Controller Reativo da Página (useNetworks)"
  tasks = [
    "Criar 'frontend/src/pages/networks/useNetworks.svelte.ts'",
    "Encapsular estados reativos ($state) de busca, seleção, modais e carregamento",
    "Integrar orquestração com stores globais (notification.svelte.ts, refresh.svelte.ts, locale.svelte.ts)",
    "Implementar métodos reativos: searchFilter, handleCreate, handleConnect, handleRemove, handlePrune"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 1.4: Modularização dos Componentes de UI da Página de Redes
  # ----------------------------------------------------------------------------
  [[phase_1.steps]]
  step = "1.4"
  title = "Decomposição dos Componentes de Página"
  tasks = [
    "Criar 'frontend/src/pages/networks/components/NetworkToolbar.svelte' (Barra de busca, ações em lote, botão criar e podar)",
    "Mover/Ajustar 'frontend/src/pages/networks/components/NetworkCard.svelte' (Card individual de cada rede com status e ações)",
    "Criar 'frontend/src/pages/networks/components/CreateNetworkModal.svelte' (Formulário e validações para nova rede)",
    "Criar 'frontend/src/pages/networks/components/ConnectContainerModal.svelte' (Seleção e anexo de containers)",
    "Criar 'frontend/src/pages/networks/components/PruneNetworksModal.svelte' (Modal de confirmação de limpeza)",
    "Refatorar 'frontend/src/pages/networks/Networks.svelte' tornando-o uma casca declarativa e limpa consumindo useNetworks e subcomponentes"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 1.5: Validação e Testes do Piloto
  # ----------------------------------------------------------------------------
  [[phase_1.steps]]
  step = "1.5"
  title = "Validação Funcional da Fase 1"
  tasks = [
    "Verificar compilação do TypeScript e Svelte (Vite build / typecheck)",
    "Testar listagem, criação, conexão de container, deleção e prune de redes",
    "Garantir ausência de quebras de contratos ou regressões no frontend"
  ]


# ==============================================================================
# FASE 2: REPLICAÇÃO NOS DEMAIS DOMÍNIOS DO SISTEMA
# Objetivo: Padronizar Containers, Volumes, Imagens e Stacks na mesma arquitetura.
# ==============================================================================

[phase_2]
name = "Escala e Padronização Completa dos Domínios"
description = "Replicação do padrão Clean Architecture/Runes para Containers, Volumes, Imagens e Stacks."

  # ----------------------------------------------------------------------------
  # Etapa 2.1: Domínio de Containers
  # ----------------------------------------------------------------------------
  [[phase_2.steps]]
  step = "2.1"
  domain = "Containers"
  tasks = [
    "Criar 'frontend/src/lib/domains/containers/domain/' (tipos de Container, Status, Métricas, Logs)",
    "Criar 'frontend/src/lib/domains/containers/infrastructure/container.wails.ts'",
    "Criar 'frontend/src/lib/domains/containers/application/' (start, stop, restart, remove, logs, inspect, rename)",
    "Criar 'frontend/src/lib/domains/containers/index.ts'",
    "Criar 'frontend/src/pages/containers/useContainers.svelte.ts'",
    "Modularizar componentes em 'frontend/src/pages/containers/components/' (ContainerCard, ContainerToolbar, ContainerLogsModal)",
    "Refatorar 'frontend/src/pages/containers/Containers.svelte'"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 2.2: Domínio de Volumes
  # ----------------------------------------------------------------------------
  [[phase_2.steps]]
  step = "2.2"
  domain = "Volumes"
  tasks = [
    "Criar 'frontend/src/lib/domains/volumes/domain/' (tipos de Volume, Driver, Mountpoints)",
    "Criar 'frontend/src/lib/domains/volumes/infrastructure/volume.wails.ts'",
    "Criar 'frontend/src/lib/domains/volumes/application/' (list, create, remove, inspect, prune)",
    "Criar 'frontend/src/lib/domains/volumes/index.ts'",
    "Criar 'frontend/src/pages/volumes/useVolumes.svelte.ts'",
    "Modularizar componentes em 'frontend/src/pages/volumes/components/' (VolumeCard, VolumeToolbar, CreateVolumeModal, PruneVolumesModal)",
    "Refatorar 'frontend/src/pages/volumes/Volumes.svelte'"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 2.3: Domínio de Imagens (Images)
  # ----------------------------------------------------------------------------
  [[phase_2.steps]]
  step = "2.3"
  domain = "Images"
  tasks = [
    "Criar 'frontend/src/lib/domains/images/domain/' (tipos de Image, Tags, Size, LayerInfo)",
    "Criar 'frontend/src/lib/domains/images/infrastructure/image.wails.ts'",
    "Criar 'frontend/src/lib/domains/images/application/' (list, pull, build, remove, tag, prune, inspect)",
    "Criar 'frontend/src/lib/domains/images/index.ts'",
    "Criar 'frontend/src/pages/images/useImages.svelte.ts'",
    "Modularizar componentes em 'frontend/src/pages/images/components/' (ImageCard, ImageToolbar, PullImageModal, PruneImagesModal)",
    "Refatorar 'frontend/src/pages/images/Images.svelte'"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 2.4: Domínio de Stacks / Compose (Complementar)
  # ----------------------------------------------------------------------------
  [[phase_2.steps]]
  step = "2.4"
  domain = "Stacks"
  tasks = [
    "Criar 'frontend/src/lib/domains/stacks/' seguindo o padrão (domain, application, infrastructure)",
    "Criar 'frontend/src/pages/stacks/useStacks.svelte.ts'",
    "Refatorar componentes e tela de Stacks"
  ]

  # ----------------------------------------------------------------------------
  # Etapa 2.5: Limpeza Final, Tipagem e Revisão Global
  # ----------------------------------------------------------------------------
  [[phase_2.steps]]
  step = "2.5"
  domain = "Consolidação Global"
  tasks = [
    "Eliminar imports diretos residuais de 'bindings/go-walis/...' nas páginas",
    "Garantir que todos os acessos ao backend passem exclusivamente pelos arquivos de 'infrastructure'",
    "Executar checagem de tipos (npm run check / build) para assegurar 100% de integridade",
    "Realizar testes de fumaça (smoke test) em toda a interface gráfica"
  ]
