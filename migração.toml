# ==============================================================================
# PLANO DE MIGRAÇÃO ARQUITETURAL - DOCKERSEA FRONTEND
# Padrão: Clean Architecture / DDD Modular com Svelte 5 (Runes)
# ==============================================================================

[metadata]
title = "Refatoração Arquitetural Completa do Frontend"
target_dir = "frontend/src"
state_management = "Svelte 5 Runes ($state, $derived, $props)"
communication_layer = "Wails Go Bindings"

